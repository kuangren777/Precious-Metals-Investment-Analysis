# 黄金价格监控系统配置文件示例
# 复制此文件为 config.ini 并填写您的配置信息
# cp config.example.ini config.ini

[Email]
# 发件邮箱配置（126邮箱）
sender_email = your_email@126.com
# 126邮箱授权码（非登录密码）
# 获取方法：登录126邮箱 -> 设置 -> POP3/SMTP/IMAP -> 开启SMTP服务 -> 获取授权密码
sender_password = your_auth_code
# 管理员邮箱（接收所有邮件：错误、启动、监控、报告等）
# 支持多个，用逗号分隔
# 示例：admin_emails = admin1@example.com, admin2@example.com
admin_emails = your_admin_email@example.com

# 用户邮箱（仅接收价格监控邮件：暴跌、价格阈值、每日报告）
# 支持多个，用逗号分隔
# 示例：user_emails = user1@example.com, user2@example.com
user_emails = your_user_email@example.com

# SMTP服务器配置
smtp_server = smtp.126.com
smtp_port = 465

[Monitor]
# 检查间隔（秒），默认10分钟
check_interval = 600

# 暴跌阈值（百分比）- 每种金属可以设置不同的阈值
# 黄金暴跌阈值
gold_crash_threshold = -2.0
# 白银暴跌阈值（白银波动较大，设置更宽松）
silver_crash_threshold = -3.0
# 铂金暴跌阈值
platinum_crash_threshold = -2.5
# 钯金暴跌阈值（钯金波动最大，设置最宽松）
palladium_crash_threshold = -3.5

# 价格阈值（元/克）- 价格穿越阈值时触发提醒（向上或向下突破）
# 支持多个阈值，用逗号分隔，每个阈值在设定的时间间隔内只触发一次
# 留空表示不启用价格提醒
# 示例：gold_price_thresholds = 1000,980,960 表示金价向上突破或向下跌破这些价格时提醒
# 触发机制：只有当价格从阈值一侧穿越到另一侧时才触发，"接近"不会触发
gold_price_thresholds =
silver_price_thresholds =
platinum_price_thresholds =
palladium_price_thresholds =

# 价格阈值提醒间隔（秒）- 同一阈值在此时间间隔内只发送一次提醒
# 例如：600=10分钟，1800=30分钟，3600=1小时
price_alert_interval = 3600

# 定时邮件发送时间（24小时制）
daily_report_times = 15:00,00:00

# 错误重试配置
max_retries = 3
retry_delay = 5

# 注意：
# - 暴跌邮件：同样的暴跌情况1小时内只发送一次
# - 错误邮件：相同错误30分钟内只发送一次
# - AI分析：仅在需要发送邮件时才调用（节省API费用）

[API]
# 工商银行贵金属价格API
# 格式：https://papi.icbc.com.cn/wapDynamicPage/goldMarket/getTouchPagePicData?dataType=0&dataId=<ID>
gold_api_url = https://papi.icbc.com.cn/wapDynamicPage/goldMarket/getTouchPagePicData?dataType=0&dataId=901
silver_api_url = https://papi.icbc.com.cn/wapDynamicPage/goldMarket/getTouchPagePicData?dataType=0&dataId=903
platinum_api_url = https://papi.icbc.com.cn/wapDynamicPage/goldMarket/getTouchPagePicData?dataType=0&dataId=905
palladium_api_url = https://papi.icbc.com.cn/wapDynamicPage/goldMarket/getTouchPagePicData?dataType=0&dataId=907

[AI]
# AI分析配置（可选，设置为none禁用AI分析）
# 支持任何兼容OpenAI格式的API服务
enable = false

# API配置（OpenAI标准格式）
api_base_url = https://api.anthropic.com/v1
api_key = your_api_key_here
model = claude-sonnet-4.5-20250929

# 也支持其他OpenAI兼容服务，例如：
# api_base_url = https://api.openai.com/v1
# model = gpt-4
#
# 或者本地部署的模型：
# api_base_url = http://localhost:11434/v1
# model = llama2

[Storage]
# 图表保存目录
charts_dir = charts
# 是否保留历史图表
keep_history = true
# 历史图表保留天数（0表示永久保留）
history_days = 30
# 是否保存AI分析结果
save_ai_analysis = true
